name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.rid }}
    strategy:
      fail-fast: false
      matrix:
        rid: [linux-x64, win-x64, osx-arm64, osx-x64]
    # .NET cross-publishes every desktop target from Linux; one runner type keeps
    # releases fast and avoids scarce macOS runners.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Package
        run: bash scripts/package.sh ${{ matrix.rid }} dist
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rid }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            ## Deskboard Native ${{ github.ref_name }}

            A native, cross-platform Tumblr client (.NET 10 + Avalonia).

            ### Install

            **Linux / macOS**
            ```bash
            curl -fsSL https://raw.githubusercontent.com/Wrecht-Dev/deskboard-native/main/scripts/install.sh | bash
            ```

            **Windows (PowerShell)**
            ```powershell
            irm https://raw.githubusercontent.com/Wrecht-Dev/deskboard-native/main/scripts/install.ps1 | iex
            ```

            Or download the archive below. Builds are self-contained — no .NET
            runtime needed. macOS builds are unsigned; right-click → Open the first
            time (or run `xattr -dr com.apple.quarantine /Applications/Deskboard.app`).
